<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에코바이오 정부지원사업 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app">
        <!-- Header -->
        <header class="bg-white border-b sticky top-0 z-10 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-lg">
                        <i data-lucide="layout" class="text-white w-5 h-5"></i>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-800">에코바이오 정부지원사업 플랫폼</h1>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center bg-slate-100 rounded-full px-4 py-1.5 text-sm font-bold text-slate-600">
                        <i data-lucide="calendar" class="w-4 h-4 mr-2"></i>
                        <span id="currentYearDisplay">2026</span>년도 아카이브
                    </div>
                    <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-md active:scale-95 font-bold">
                        <i data-lucide="plus" class="w-4 h-4"></i> 신규 등록
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="grid grid-cols-12 gap-8">
                <!-- Main Dashboard -->
                <div class="col-span-12 lg:col-span-8 space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex gap-2 bg-white p-1 rounded-xl shadow-sm border" id="yearSelector">
                            <!-- Years will be injected here -->
                        </div>
                        <div class="bg-white px-4 py-2 rounded-xl shadow-sm border text-sm font-bold text-slate-600">
                            검색 결과: <span id="projectCount" class="text-indigo-600">0</span>건
                        </div>
                    </div>

                    <div id="projectList" class="space-y-4">
                        <!-- Projects will be injected here -->
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="col-span-12 lg:col-span-4 space-y-6">
                    <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                        <div class="flex items-center gap-2 mb-6 relative z-10">
                            <div class="bg-indigo-500/20 p-2 rounded-xl">
                                <i data-lucide="trending-up" class="text-indigo-400 w-5 h-5"></i>
                            </div>
                            <h3 class="font-black text-lg">AI 맞춤형 공고 추천</h3>
                        </div>
                        
                        <div class="space-y-4 relative z-10" id="aiRecommendations">
                            <!-- Recommendations will be injected here -->
                        </div>
                        <button class="w-full mt-8 py-4 bg-indigo-600 hover:bg-indigo-700 rounded-2xl text-xs font-black transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                            스마트 공고 전체보기 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="bg-white rounded-[2rem] p-8 border border-slate-100 shadow-sm">
                        <h4 class="font-black text-slate-800 mb-6 flex items-center gap-2 uppercase text-xs tracking-widest text-slate-400">
                            <i data-lucide="settings" class="w-4 h-4"></i> 관리 팁
                        </h4>
                        <div class="space-y-4">
                            <div class="flex gap-3 text-sm text-slate-500 font-medium">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 mt-1.5 shrink-0"></span>
                                <p>데이터는 실시간으로 클라우드에 동기화됩니다.</p>
                            </div>
                            <div class="flex gap-3 text-sm text-slate-500 font-medium">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 mt-1.5 shrink-0"></span>
                                <p>상세 진행현황을 수시로 업데이트하여 이력을 관리하세요.</p>
                            </div>
                            <div class="flex gap-3 text-sm text-slate-500 font-medium">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 mt-1.5 shrink-0"></span>
                                <p>URL을 등록하면 원본 공고로 바로 연결됩니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal -->
        <div id="modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-[3rem] w-full max-w-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
                <div class="px-10 py-8 border-b flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight">지원과제 신규 등록</h2>
                        <p class="text-sm text-slate-500 mt-1 font-medium">관리할 사업의 상세 정보를 입력해 주세요.</p>
                    </div>
                    <button onclick="toggleModal(false)" class="text-slate-400 hover:text-rose-500 p-3 hover:bg-rose-50 rounded-full transition-all">
                        <i data-lucide="x" class="w-8 h-8"></i>
                    </button>
                </div>
                
                <form id="projectForm" class="p-10 overflow-y-auto space-y-8 custom-scrollbar">
                    <!-- 기본 정보 -->
                    <section class="space-y-4">
                        <h3 class="text-[11px] font-black text-indigo-500 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="info" class="w-3.5 h-3.5"></i> 기본 사업 정보
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">사업명</label>
                                <input name="title" required placeholder="공식 사업명을 입력하세요" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">주관처 (기관)</label>
                                <input name="agency" required placeholder="예: 중소벤처기업부" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">사업 분야</label>
                                <select name="category" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold appearance-none">
                                    <option>연구과제</option><option>제조지원</option><option>홍보마케팅</option><option>경영지원</option><option>인력양성</option><option>임상/인증</option><option>기타</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <!-- 상세 내용 -->
                    <section class="space-y-4">
                        <h3 class="text-[11px] font-black text-indigo-500 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 상세 내역 및 일정
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">주요 내용</label>
                                <textarea name="content" rows="3" placeholder="참여 조건을 간략히 입력하세요" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold"></textarea>
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">사업비</label>
                                <input name="cost" placeholder="예: 최대 1억원" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">일정 (기한)</label>
                                <input name="schedule" placeholder="예: 26.03.01 ~ 26.03.31" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                        </div>
                    </section>

                    <!-- 진행 및 상태 -->
                    <section class="space-y-4">
                        <h3 class="text-[11px] font-black text-indigo-500 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="trending-up" class="w-3.5 h-3.5"></i> 진행 및 관리 상태
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">현재 진행현황</label>
                                <input name="progress" placeholder="예: 사업계획서 초안 작성 완료" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">관리 상태</label>
                                <select name="status" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold appearance-none">
                                    <option>접수대기</option><option>서류준비</option><option>제출완료</option><option>심사중</option><option>선정</option><option>탈락</option><option>수행중</option><option>종료</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">관련 연도</label>
                                <select name="year" id="formYearSelect" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold appearance-none">
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">공고 URL</label>
                                <input name="url" placeholder="https://..." class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-black text-slate-400 uppercase ml-1 mb-2">비고사항</label>
                                <input name="notes" placeholder="기타 참고할 메모를 입력하세요" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold">
                            </div>
                        </div>
                    </section>
                    
                    <div class="flex gap-4 pt-6 bg-white sticky bottom-0">
                        <button type="button" onclick="toggleModal(false)" class="flex-1 py-5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-[1.5rem] transition-all">취소</button>
                        <button type="submit" class="flex-[2] py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-[1.5rem] shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-2 active:scale-95">
                            <i data-lucide="save" class="w-6 h-6"></i> 프로젝트 저장하기
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gov-project-manager';

        // State
        let projects = [];
        let selectedYear = new Date().getFullYear().toString();
        const years = ['2024', '2025', '2026', '2027', '2028'];

        // Elements
        const projectListEl = document.getElementById('projectList');
        const projectCountEl = document.getElementById('projectCount');
        const yearSelectorEl = document.getElementById('yearSelector');
        const modalEl = document.getElementById('modal');
        const form = document.getElementById('projectForm');
        const formYearSelect = document.getElementById('formYearSelect');
        const currentYearDisplay = document.getElementById('currentYearDisplay');

        // Functions
        const renderYears = () => {
            yearSelectorEl.innerHTML = years.map(year => `
                <button onclick="changeYear('${year}')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all ${selectedYear === year ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:bg-slate-50'}">
                    ${year}년
                </button>
            `).join('');
            
            formYearSelect.innerHTML = years.map(year => `<option value="${year}" ${selectedYear === year ? 'selected' : ''}>${year}년</option>`).join('');
            currentYearDisplay.textContent = selectedYear;
        };

        window.changeYear = (year) => {
            selectedYear = year;
            renderYears();
            renderProjects();
        };

        window.toggleModal = (show) => {
            if (show) modalEl.classList.remove('hidden');
            else modalEl.classList.add('hidden');
        };

        const renderProjects = () => {
            const filtered = projects.filter(p => p.year === selectedYear);
            projectCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                projectListEl.innerHTML = `
                    <div class="bg-white rounded-[2rem] p-16 text-center border-2 border-dashed border-slate-200">
                        <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="file-text" class="text-slate-300 w-10 h-10"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-700">${selectedYear}년도 데이터가 없습니다.</h3>
                        <p class="text-slate-500 mt-2 font-medium">새로운 지원사업을 등록하여 체계적으로 관리하세요.</p>
                    </div>
                `;
            } else {
                projectListEl.innerHTML = filtered.map(p => `
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 hover:shadow-lg transition-all overflow-hidden group">
                        <div class="p-8">
                            <div class="flex items-start justify-between mb-4">
                                <div class="flex flex-wrap gap-2">
                                    <span class="px-3 py-1 rounded-lg text-[11px] font-black bg-indigo-50 text-indigo-600 border border-indigo-100">${p.category}</span>
                                    <span class="px-3 py-1 rounded-lg text-[11px] font-black bg-slate-100 text-slate-600">${p.agency}</span>
                                    <span class="px-3 py-1 rounded-lg text-[11px] font-black border ${p.status === '선정' || p.status === '수행중' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-orange-50 text-orange-600 border-orange-100'}">${p.status}</span>
                                </div>
                                <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    ${p.url ? `<a href="${p.url}" target="_blank" class="p-2 hover:bg-indigo-50 rounded-lg text-slate-400 hover:text-indigo-600"><i data-lucide="external-link" class="w-5 h-5"></i></a>` : ''}
                                    <button onclick="handleDelete('${p.id}')" class="p-2 hover:bg-rose-50 rounded-lg text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                            <h3 class="text-xl font-black text-slate-800 mb-3">${p.title}</h3>
                            <p class="text-slate-600 text-sm mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100 italic">"${p.content || '내용 없음'}"</p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                                <div class="space-y-1"><p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">사업비</p><p class="text-sm font-bold text-slate-700">${p.cost || '-'}</p></div>
                                <div class="space-y-1"><p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">일정</p><p class="text-sm font-bold text-slate-700">${p.schedule || '-'}</p></div>
                                <div class="space-y-1"><p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">진행현황</p><p class="text-sm font-bold text-indigo-600">${p.progress || '-'}</p></div>
                                <div class="space-y-1"><p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">비고</p><p class="text-sm font-medium text-slate-500 truncate">${p.notes || '-'}</p></div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        };

        window.handleDelete = async (id) => {
            if (confirm("정말 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id));
            }
        };

        // Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), {
                    ...data,
                    createdAt: new Date().toISOString()
                });
                form.reset();
                toggleModal(false);
            } catch (err) {
                console.error("Save error", err);
            }
        });

        // Init
        const init = async () => {
            await signInAnonymously(auth);
            
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), orderBy('year', 'desc'));
            onSnapshot(q, (snapshot) => {
                projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderProjects();
            });

            renderYears();
            lucide.createIcons();

            // Render Recommendations
            const recommendations = [
                { agency: '중소벤처기업부', title: '2026 스타트업 AI기술인력 양성 교육운영사 모집', deadline: '2026-02-10' },
                { agency: '중기부', title: '2026년 마케팅지원사업 통합 공고', deadline: '2026-02-28' }
            ];
            document.getElementById('aiRecommendations').innerHTML = recommendations.map(rec => `
                <div class="bg-white/5 hover:bg-white/10 p-5 rounded-2xl transition-all border border-white/5 cursor-pointer group">
                    <p class="text-[10px] text-indigo-400 font-black mb-1 uppercase tracking-tighter">${rec.agency}</p>
                    <p class="text-sm font-bold mb-3 group-hover:text-indigo-200 leading-tight">${rec.title}</p>
                    <div class="flex justify-between items-center text-[10px] text-slate-500 font-black">
                        <span>마감기한</span><span class="text-rose-400">${rec.deadline}</span>
                    </div>
                </div>
            `).join('');
        };

        window.onload = init;
    </script>
</body>
</html>
