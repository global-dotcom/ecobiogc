<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에코바이오 정부지원사업 플랫폼</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --font-pretendard: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body { 
            font-family: var(--font-pretendard);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        body.loaded {
            opacity: 1;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        #modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #modal.active {
            display: flex;
            opacity: 1;
        }

        input:focus, select:focus, textarea:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        i[data-lucide] {
            display: inline-block;
            width: 1.25rem;
            height: 1.25rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-indigo-100 selection:text-indigo-900">
    <div id="app">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200 flex items-center justify-center">
                        <i data-lucide="layout" class="text-white w-5 h-5"></i>
                    </div>
                    <h1 class="text-xl font-black tracking-tight text-slate-800">에코바이오 <span class="text-indigo-600">G-Biz</span></h1>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center bg-slate-100 rounded-full px-4 py-2 text-xs font-bold text-slate-600 border border-slate-200">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 mr-2 text-indigo-500"></i>
                        <span id="currentYearDisplay">2026</span>년도 아카이브
                    </div>
                    <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-md hover:shadow-indigo-200 active:scale-95 font-bold text-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> 신규 등록
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="grid grid-cols-12 gap-8">
                <!-- Main Dashboard -->
                <div class="col-span-12 lg:col-span-8 space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex gap-1.5 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200" id="yearSelector"></div>
                        <div class="bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-200 text-xs font-bold text-slate-500">
                            총 <span id="projectCount" class="text-indigo-600 text-sm">0</span>건의 프로젝트
                        </div>
                    </div>

                    <div id="projectList" class="space-y-5">
                        <div class="p-20 text-center text-slate-400">데이터를 불러오는 중입니다...</div>
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="col-span-12 lg:col-span-4 space-y-6">
                    <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full -mr-16 -mt-16 blur-3xl"></div>
                        <div class="flex items-center gap-2 mb-6 relative z-10">
                            <div class="bg-indigo-500/20 p-2.5 rounded-xl">
                                <i data-lucide="sparkles" class="text-indigo-400 w-5 h-5"></i>
                            </div>
                            <h3 class="font-black text-lg">AI 맞춤형 공고 추천</h3>
                        </div>
                        <div class="space-y-4 relative z-10" id="aiRecommendations"></div>
                        <button class="w-full mt-8 py-4 bg-indigo-600 hover:bg-indigo-700 rounded-2xl text-xs font-black transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/40">
                            스마트 공고 전체보기 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="bg-white rounded-[2rem] p-8 border border-slate-200 shadow-sm relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        <h4 class="font-black text-slate-400 mb-6 flex items-center gap-2 uppercase text-[10px] tracking-widest">
                            <i data-lucide="help-circle" class="w-4 h-4 text-indigo-500"></i> Platform Guide
                        </h4>
                        <div class="space-y-5">
                            <div class="flex gap-4 group/item">
                                <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center shrink-0 border border-slate-100 group-hover/item:bg-indigo-50 transition-colors">
                                    <i data-lucide="cloud" class="w-5 h-5 text-slate-400 group-hover/item:text-indigo-500"></i>
                                </div>
                                <p class="text-[13px] text-slate-500 font-bold leading-relaxed pt-1">데이터는 실시간으로 클라우드에 동기화되어 팀원과 공유됩니다.</p>
                            </div>
                            <div class="flex gap-4 group/item">
                                <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center shrink-0 border border-slate-100 group-hover/item:bg-indigo-50 transition-colors">
                                    <i data-lucide="clock" class="w-5 h-5 text-slate-400 group-hover/item:text-indigo-500"></i>
                                </div>
                                <p class="text-[13px] text-slate-500 font-bold leading-relaxed pt-1">상세 진행현황을 수시로 업데이트하여 사업 이력을 체계적으로 관리하세요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal -->
        <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-[2.5rem] w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden scale-95 transition-all duration-300" id="modalContent">
                <div class="px-8 py-6 border-b flex justify-between items-center bg-slate-50/50">
                    <h2 class="text-xl font-black text-slate-800 tracking-tight">지원과제 등록</h2>
                    <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 p-2 hover:bg-slate-100 rounded-full transition-all flex items-center justify-center">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                
                <form id="projectForm" class="p-8 overflow-y-auto space-y-6 custom-scrollbar">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">사업명</label>
                            <input name="title" required placeholder="공식 사업명을 입력하세요" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">주관처</label>
                            <input name="agency" required placeholder="예: 중소벤처기업부" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">사업 분야</label>
                            <select name="category" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm cursor-pointer">
                                <option>연구과제</option><option>제조지원</option><option>홍보마케팅</option><option>경영지원</option><option>인력양성</option><option>임상/인증</option><option>기타</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">주요 내용</label>
                            <textarea name="content" rows="2" placeholder="참여 조건을 간략히 입력하세요" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">사업비</label>
                            <input name="cost" placeholder="예: 최대 1억원" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">일정 (기한)</label>
                            <input name="schedule" placeholder="예: 26.03.31 까지" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">현재 진행상황</label>
                            <input name="progress" placeholder="예: 초안 작성 중" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">관리 상태</label>
                            <select name="status" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm cursor-pointer">
                                <option>접수대기</option><option>서류준비</option><option>제출완료</option><option>심사중</option><option>선정</option><option>탈락</option><option>수행중</option><option>종료</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">연도</label>
                            <select name="year" id="formYearSelect" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm cursor-pointer">
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">공고 URL</label>
                            <input name="url" placeholder="https://..." class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 transition-all outline-none font-bold text-sm">
                        </div>
                    </div>
                    
                    <div class="flex gap-3 pt-4 sticky bottom-0 bg-white border-t">
                        <button type="button" onclick="toggleModal(false)" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-2xl transition-all text-sm">취소</button>
                        <button type="submit" class="flex-[2] py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-xl shadow-indigo-100 transition-all flex items-center justify-center gap-2 active:scale-95 text-sm">
                            <i data-lucide="check" class="w-5 h-5"></i> 프로젝트 저장
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variable handling
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gov-project-manager';

        let projects = [];
        let selectedYear = new Date().getFullYear().toString();
        const years = ['2024', '2025', '2026', '2027', '2028'];

        const projectListEl = document.getElementById('projectList');
        const projectCountEl = document.getElementById('projectCount');
        const yearSelectorEl = document.getElementById('yearSelector');
        const modalEl = document.getElementById('modal');
        const modalContent = document.getElementById('modalContent');
        const form = document.getElementById('projectForm');
        const formYearSelect = document.getElementById('formYearSelect');
        const currentYearDisplay = document.getElementById('currentYearDisplay');

        const updateUI = () => {
            renderYears();
            renderProjects();
            renderRecommendations();
            if (window.lucide) lucide.createIcons();
        };

        const renderYears = () => {
            yearSelectorEl.innerHTML = years.map(year => `
                <button onclick="changeYear('${year}')" class="px-5 py-2 rounded-xl text-xs font-black transition-all ${selectedYear === year ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-100' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-600'}">
                    ${year}년
                </button>
            `).join('');
            formYearSelect.innerHTML = years.map(year => `<option value="${year}" ${selectedYear === year ? 'selected' : ''}>${year}년</option>`).join('');
            currentYearDisplay.textContent = selectedYear;
        };

        window.changeYear = (year) => {
            selectedYear = year;
            updateUI();
        };

        window.toggleModal = (show) => {
            if (show) {
                modalEl.style.display = 'flex';
                setTimeout(() => {
                    modalEl.classList.add('active');
                    modalContent.classList.remove('scale-95');
                }, 10);
            } else {
                modalEl.classList.remove('active');
                modalContent.classList.add('scale-95');
                setTimeout(() => { modalEl.style.display = 'none'; }, 300);
            }
        };

        const renderProjects = () => {
            // Memory-based filtering and sorting (Rule 2: Avoid complex queries)
            const filtered = projects
                .filter(p => p.year === selectedYear)
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            projectCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                projectListEl.innerHTML = `
                    <div class="bg-white rounded-[2.5rem] p-20 text-center border border-slate-200 shadow-sm">
                        <div class="bg-slate-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="folder-open" class="text-slate-300 w-12 h-12"></i>
                        </div>
                        <h3 class="text-xl font-black text-slate-800">${selectedYear}년 데이터가 비어있습니다.</h3>
                        <p class="text-slate-400 mt-2 font-medium">새로운 지원사업을 등록하여 목록을 채워보세요.</p>
                    </div>
                `;
            } else {
                projectListEl.innerHTML = filtered.map(p => {
                    const statusColor = p.status === '선정' || p.status === '수행중' ? 'bg-emerald-500' : 
                                      p.status === '탈락' ? 'bg-rose-500' : 'bg-amber-500';
                    return `
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 hover:shadow-xl hover:shadow-slate-200/50 transition-all duration-300 overflow-hidden group">
                        <div class="p-8">
                            <div class="flex items-start justify-between mb-5">
                                <div class="flex flex-wrap gap-2">
                                    <span class="px-3 py-1.5 rounded-lg text-[10px] font-black bg-indigo-50 text-indigo-600 border border-indigo-100 uppercase tracking-tight">${p.category}</span>
                                    <span class="px-3 py-1.5 rounded-lg text-[10px] font-black bg-slate-100 text-slate-500 border border-slate-200">${p.agency}</span>
                                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black bg-white border border-slate-200">
                                        <span class="w-1.5 h-1.5 rounded-full ${statusColor} animate-pulse"></span>
                                        ${p.status}
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    ${p.url ? `<a href="${p.url}" target="_blank" class="p-2.5 hover:bg-indigo-50 rounded-xl text-slate-300 hover:text-indigo-600 flex items-center justify-center"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
                                    <button onclick="handleDelete('${p.id}')" class="p-2.5 hover:bg-rose-50 rounded-xl text-slate-300 hover:text-rose-600 flex items-center justify-center"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                            <h3 class="text-xl font-black text-slate-800 mb-4 group-hover:text-indigo-600 transition-colors">${p.title}</h3>
                            <p class="text-slate-500 text-sm mb-8 leading-relaxed font-medium">
                                <i data-lucide="quote" class="inline-block w-3 h-3 text-slate-200 mr-2 -mt-1"></i>
                                ${p.content || '등록된 설명이 없습니다.'}
                            </p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 pt-6 border-t border-slate-50">
                                <div><p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-1.5">지원 예산</p><p class="text-sm font-bold text-slate-700 truncate">${p.cost || '-'}</p></div>
                                <div><p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-1.5">마감 일정</p><p class="text-sm font-bold text-slate-700 truncate">${p.schedule || '-'}</p></div>
                                <div><p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-1.5">진행상태</p><p class="text-sm font-bold text-indigo-600 truncate">${p.progress || '-'}</p></div>
                                <div><p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-1.5">비고</p><p class="text-sm font-medium text-slate-400 truncate italic">${p.notes || '-'}</p></div>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }
            if (window.lucide) lucide.createIcons();
        };

        const renderRecommendations = () => {
            const recommendations = [
                { agency: '중기부', title: '2026 스타트업 AI 고도화 기술지원 사업', deadline: '26.02.15' },
                { agency: '산자부', title: '글로벌 제조 혁신 테크 브릿지 공고', deadline: '26.03.01' }
            ];
            document.getElementById('aiRecommendations').innerHTML = recommendations.map(rec => `
                <div class="bg-white/5 hover:bg-white/10 p-5 rounded-2xl transition-all border border-white/5 cursor-pointer group">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                        <p class="text-[10px] text-indigo-400 font-black uppercase tracking-tighter">${rec.agency}</p>
                    </div>
                    <p class="text-sm font-bold mb-3 group-hover:text-indigo-200 leading-tight">${rec.title}</p>
                    <div class="flex justify-between items-center text-[10px] text-slate-500 font-black">
                        <span class="flex items-center gap-1"><i data-lucide="timer" class="w-3 h-3"></i> D-Day</span>
                        <span class="text-rose-400 font-bold">${rec.deadline}</span>
                    </div>
                </div>
            `).join('');
        };

        window.handleDelete = async (id) => {
            if (!auth.currentUser) return;
            if (confirm("프로젝트 정보를 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id));
                } catch (e) { console.error("Delete failed", e); }
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), {
                    ...data,
                    createdAt: new Date().toISOString()
                });
                form.reset();
                toggleModal(false);
            } catch (err) { console.error("Save error", err); }
        });

        const init = async () => {
            document.body.classList.add('loaded');
            
            // Step 1: Authentication handling (Rule 3)
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth initialization failed", err);
            }

            // Step 2: Listen for Auth State changes
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Simple query (Rule 2: Fetch all, then sort in JS memory)
                    const q = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
                    onSnapshot(q, (snapshot) => {
                        projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        updateUI();
                    }, (error) => {
                        console.error("Firestore snapshot error:", error);
                        projectListEl.innerHTML = `<div class="p-20 text-center text-rose-400 font-bold">데이터 권한이 없거나 불러오는 중 오류가 발생했습니다.</div>`;
                    });
                } else {
                    projectListEl.innerHTML = `<div class="p-20 text-center text-slate-400">인증을 시도하는 중입니다...</div>`;
                }
            });

            updateUI();
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
